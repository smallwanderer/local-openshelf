[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotori-sync"
version = "0.1.0"
description = "Background folder-watching daemon for one-way Dotori sync"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dotori-cli",
  "watchdog>=4,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
dotori-sync = "dotori_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../dotori-cli/src"]
testpaths = ["tests"]
