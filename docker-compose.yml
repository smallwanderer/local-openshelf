name: dotori

x-dotori-ai-build: &dotori-ai-build
  context: .
  dockerfile: app/Dockerfile
  target: backend
  args:
    # Parser and embedding both use Torch.  Keep one shared AI image while
    # separating their runtime roles and model ownership by process.
    INSTALL_AI_DEPS: "1"
    INSTALL_PARSER_DOCLING: "1"
    INSTALL_TEST_DEPS: "0"

services:
  db:
    image: pgvector/pgvector:pg16
    command: [ "postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on" ]
    container_name: db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    # Its own image skips:
    # requirements.ai.txt (torch, FlagEmbedding, sentence-transformers) and
    # requirements.parser-docling.txt (docling, torchvision, tesseract-ocr)
    image: dotori-app-web:local
    build:
      context: .
      dockerfile: app/Dockerfile
      target: web
      args:
        INSTALL_AI_DEPS: "0"
        INSTALL_PARSER_DOCLING: "0"
        INSTALL_TEST_DEPS: "0"
    container_name: app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOTORI_DJANGO_ALLOWED_HOSTS: ${DOTORI_DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # 4173 is the local Vite dev server. Production serves the SPA from the
      # same origin and should override this list with its HTTPS origin.
      DOTORI_DJANGO_CSRF_TRUSTED_ORIGINS: ${DOTORI_DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:4173,http://127.0.0.1:4173}
      DOTORI_DJANGO_SECURE_PROXY_SSL_HEADER: ${DOTORI_DJANGO_SECURE_PROXY_SSL_HEADER:-0}
      DOTORI_DJANGO_SECURE_SSL_REDIRECT: ${DOTORI_DJANGO_SECURE_SSL_REDIRECT:-0}
      DOTORI_DJANGO_SESSION_COOKIE_SECURE: ${DOTORI_DJANGO_SESSION_COOKIE_SECURE:-0}
      DOTORI_DJANGO_CSRF_COOKIE_SECURE: ${DOTORI_DJANGO_CSRF_COOKIE_SECURE:-0}
      DOTORI_SPA_ENABLED: ${DOTORI_SPA_ENABLED:-1}
      RUNTIME_SCOPE: production
      SERVICE_NAME: app
      EMBEDDING_SERVICE_URL: http://embedding-executor:${EMBEDDING_SERVICE_PORT:-8001}
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/staticfiles:/app/staticfiles
      - ./data/logs:/data/logs
      - ./data/evaluation:/data/evaluation
      - ./data/config:/data/config
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      embedding-executor:
        condition: service_healthy
    networks:
      - default
      - rag-runtime
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      bash -lc "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn config.asgi:application --worker-class uvicorn_worker.UvicornWorker --bind 0.0.0.0:8000 --workers $${WEB_CONCURRENCY:-2} --timeout $${GUNICORN_TIMEOUT:-360}"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/files/healthcheck/')" ]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 60s

  test:
    profiles: [ "test" ]
    image: dotori-app-test:local
    build:
      context: .
      dockerfile: app/Dockerfile
      target: backend
      args:
        INSTALL_AI_DEPS: "1"
        INSTALL_PARSER_DOCLING: "1"
        INSTALL_TEST_DEPS: "1"
    env_file:
      - .env
    volumes:
      - ./installation:/app/installation:ro
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
    # Resource-snapshot tests need the production config mount point to exist,
    # but must never inspect or mutate the host's real runtime configuration.
    tmpfs:
      - /data/config
      - /data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [ "python", "-m", "pytest" ]

  embedding-executor:
    # The only process that loads local embedding model, parsing model(if needed).
    image: dotori-app:local
    build: *dotori-ai-build
    container_name: embedding-executor
    restart: unless-stopped
    # Allocating GPU to embedding-executor may induce OOM when dotori-llm 
    # oversubscribe GPU memory. If OOM occurs, remove this section.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    # Relative CPU priority: app and dotori-llm are eleft at Docker's default 
    # prioity (1024), and so under contention over CPU cores, embedding-executor
    # is de-priotized.
    cpu_shares: ${EMBEDDING_MODEL_CPU_SHARES:-256}
    env_file:
      - .env
    volumes:
      - ./data/logs:/data/logs
      - ./data/config:/data/config
      - huggingface-cache:/app/.cache/huggingface
    environment:
      RUNTIME_SCOPE: production
      SERVICE_NAME: embedding-executor
      DOTORI_SERVICE_ROLE: embedding-model
      DOTORI_EXECUTOR_ROLE: embedding
      # app calls /embed/ over the compose network instead of loading the model itself;
      # this Host header must be accepted.
      DOTORI_DJANGO_ALLOWED_HOSTS: embedding-executor,localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "${EMBEDDING_SERVICE_PORT:-8001}"
    # One model-owning process recommended. Increasing --workers would load multiple models.
    command: [ "bash", "-lc", "DOTORI_EMBEDDING_MODEL_PROCESS=1 exec gunicorn config.wsgi:application --bind 0.0.0.0:$${EMBEDDING_SERVICE_PORT:-8001} --workers 1 --threads $${EMBEDDING_HTTP_THREADS:-8} --timeout $${EMBEDDING_EXECUTOR_TIMEOUT:-1860}" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${EMBEDDING_SERVICE_PORT:-8001}/readyz')" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  parser-executor:
    image: dotori-app:local
    container_name: parser-executor
    restart: unless-stopped
    cpu_shares: ${PARSE_WORKER_CPU_SHARES:-256}
    env_file:
      - .env
    volumes:
      - ./data/uploads:/data/uploads
      - ./data/logs:/data/logs
      - ./data/config:/data/config:ro
      - huggingface-cache:/app/.cache/huggingface
    environment:
      RUNTIME_SCOPE: production
      SERVICE_NAME: parser-executor
      DOTORI_SERVICE_ROLE: parser
      DOTORI_EXECUTOR_ROLE: parser
      DOTORI_DJANGO_ALLOWED_HOSTS: parser-executor,localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "${PARSER_EXECUTOR_PORT:-8002}"
    command: [ "gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:${PARSER_EXECUTOR_PORT:-8002}", "--workers", "1", "--threads", "${PARSER_EXECUTOR_HTTP_THREADS:-2}", "--timeout", "${PARSER_EXECUTOR_TIMEOUT:-1860}" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${PARSER_EXECUTOR_PORT:-8002}/readyz')" ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s

  dotori-orchestrator:
    # Queue transport only: It dispatches durable work to the executors via HTTP APIs.
    image: dotori-orchestrator:local
    build:
      context: .
      dockerfile: app/Dockerfile
      target: backend
      args:
        INSTALL_AI_DEPS: "0"
        INSTALL_PARSER_DOCLING: "0"
        INSTALL_TEST_DEPS: "0"
    container_name: dotori-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data/logs:/data/logs
      - ./data/config:/data/config:ro
    environment:
      RUNTIME_SCOPE: production
      SERVICE_NAME: dotori-orchestrator
      DOTORI_SERVICE_ROLE: orchestrator
      PARSER_EXECUTOR_URL: http://parser-executor:${PARSER_EXECUTOR_PORT:-8002}
      EMBEDDING_SERVICE_URL: http://embedding-executor:${EMBEDDING_SERVICE_PORT:-8001}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      parser-executor:
        condition: service_healthy
      embedding-executor:
        condition: service_healthy
    command: [ "celery", "-A", "config", "worker", "-P", "threads", "-l", "info", "-Q", "parse,embed", "--concurrency=${ORCHESTRATOR_CONCURRENCY:-2}", "--prefetch-multiplier=1", "--hostname=orchestrator@%h" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; from config.celery import app; raise SystemExit(0 if app.control.ping(destination=['orchestrator@' + os.uname().nodename], timeout=2) else 1)" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:stable
    container_name: nginx
    restart: unless-stopped
    profiles: [ "direct-https" ]
    environment:
      DOTORI_EXTERNAL_DOMAIN: ${DOTORI_EXTERNAL_DOMAIN:-}
      NGINX_ENVSUBST_FILTER: "^DOTORI_EXTERNAL_DOMAIN$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/config/network_access/nginx:/etc/nginx/templates:ro
      - ./data/certbot/www:/var/www/certbot:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nginx", "-t" ]
      interval: 10s
      timeout: 5s
      retries: 3

# The RAG runtime container (llama.cpp or vLLM, whichever is selected) is
# NOT defined here. It's a single, scope-scoped container ("dotori-llm") managed
# directly by app/llm_installation/runtime_lifecycle.py (plain docker build),
# reachable from app at http://rag-runtime:8080 over the named "rag-runtime" network below.
networks:
  rag-runtime:
    name: dotori-runtime
    driver: bridge

volumes:
  postgres-data:
    name: dotori-postgres-data
  huggingface-cache:
    name: dotori-huggingface-cache
