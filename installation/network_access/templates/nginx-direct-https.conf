server {
    listen 80;
    server_name ${DOTORI_EXTERNAL_DOMAIN};

    server_tokens off;
    client_max_body_size 200m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOTORI_EXTERNAL_DOMAIN};

    server_tokens off;
    client_max_body_size 200m;

    # Operators may replace these paths to match their certificate layout.
    ssl_certificate /etc/letsencrypt/live/${DOTORI_EXTERNAL_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOTORI_EXTERNAL_DOMAIN}/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DotoriTLS:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Defense in depth: /livez, /readyz, /embed/ are embedding-executor's
    # internal-only routes (config.embedding_urls). app's own urlconf never
    # defines them, so these already 404 through app -- this just stops them
    # before they reach app at all.
    location ~ ^/(livez|readyz|embed/)$ {
        return 404;
    }

    location /api/document-ai/v1/rag/stream/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
